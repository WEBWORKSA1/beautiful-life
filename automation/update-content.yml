# OPTIONAL daily server-side refresh of data/news.json and data/videos.json.
# The live site already refreshes news in visitors' browsers, so this is a bonus.
# To activate: on GitHub, Add file -> Create new file, name it
#   .github/workflows/update-content.yml
# and paste this file's contents. GitHub Pages rebuilds the site automatically after each commit.
name: Daily content refresh

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/update_feeds.py
      - run: |
          git config user.name "beautiful-life-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: daily content refresh"
          git push
